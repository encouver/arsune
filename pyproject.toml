[project]
name = "arsune"
version = "0.1.0"
description = "Website checks with independent evidence verification"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "celery[redis]>=5.4,<6",
  "httpx[brotli]>=0.28,<1",
  "playwright>=1.50,<2",
  "pynacl>=1.5,<2",
  "base58>=2.1,<3",
  "coincurve>=21,<22",
  "pycryptodome>=3.20,<4",
  "anthropic>=2.7.0",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["backend/app"]
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
markers = ["network: read-only calls to NEAR mainnet RPC (deselect with -m 'not network')"]
[tool.ruff]
target-version = "py312"
line-length = 100
