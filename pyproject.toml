[project]
name = "arsune"
version = "0.1.0"
description = "Website checks with independent evidence verification"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "celery[redis]>=5.4,<6", "httpx>=0.28,<1", "playwright>=1.50,<2",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["backend/arsune"]
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
[tool.ruff]
target-version = "py312"
line-length = 100
