[package]
name = "arsune-escrow"
version = "0.1.0"
edition = "2021"
description = "Non-custodial bounty escrow for Arsune: money rules enforced on chain, rulings by the judge"
repository = "https://github.com/encouver/arsune"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

# `cargo near build reproducible-wasm` (after commit and push) builds in this image and embeds
# the commit in the NEP-330 metadata, so explorers can verify the deployed code. build.sh runs
# the same command in the same image for local, uncommitted builds.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.97.1"
image_digest = "sha256:7467038bdddc86484b73b416eeadce926ff59013e128e53dec5a19e1cb4b2234"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]
