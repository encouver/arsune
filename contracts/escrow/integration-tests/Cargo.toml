[package]
name = "arsune-escrow-integration-tests"
version = "0.1.0"
edition = "2021"
publish = false

# Sandbox tests: the escrow wasm against the real intents.near (defuse 0.4.5) wasm.
# Run through ../test.sh, which builds and fetches the wasm files and sets their paths.

[dev-dependencies]
anyhow = "1"
base64 = "0.22"
bs58 = "0.5"
ed25519-dalek = "2"
near-workspaces = "0.24.0"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0
